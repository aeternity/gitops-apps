app:
  image:
    tag: v1.5.0
  secrets:
    external:
      remotePrefix: /k8s/prd-0e9c
  ingress:
    hosts:
      - host: "hyperchain-bridge.prd.aepps.com"
        paths:
          - path: "/"
      - host: "bridge.hyperchains.ae"
        paths:
          - path: "/"
    tls:
      - hosts:
          - "bridge.hyperchains.ae"
          - "hyperchain-bridge.prd.aepps.com"
        secretName: aepp-hc-bridge-cert

postgresql:
  enabled: true
  auth:
    enablePostgresUser: false
    existingSecret: aepp-hyperchain-bridge-app-external-secrets
    secretKeys:
      userPasswordKey: PG_PASSWORD
  primary:
    persistence:
      storageClass: gp3
